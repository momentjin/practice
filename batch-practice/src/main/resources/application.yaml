spring:
  application:
    name: batch-practice
  config:
    import: optional:file:.env[.properties]
  main:
    web-application-type: none
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:batch_practice}?rewriteBatchedStatements=true&connectionTimeZone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
        format_sql: true
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

# SQL 문장만 출력하고 바인딩 값 로그는 끈다.
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: OFF
