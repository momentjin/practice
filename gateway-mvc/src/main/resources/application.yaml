spring:
  application:
    name: gateway-mvc
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health

practice:
  backend-uri: ${BACKEND_URI:http://localhost:8080}
